name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build per-skill zips
        run: |
          mkdir -p dist
          cd skills
          for skill_dir in */; do
            skill_name="${skill_dir%/}"
            zip -r "../dist/${skill_name}.zip" "${skill_name}/"
            echo "✓ dist/${skill_name}.zip"
          done
          cd ..
          echo "Built zips:"
          ls -lh dist/

      - name: Create release and upload zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
