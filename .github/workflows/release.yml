name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build per-skill zips
        run: |
          mkdir -p dist
          cd skills
          for skill_dir in */; do
            skill_name="${skill_dir%/}"
            zip -r "../dist/${skill_name}.skill" "${skill_name}/"
            echo "✓ dist/${skill_name}.skill"
          done
          cd ..
          echo "Built zips:"
          ls -lh dist/

      - name: Upload zips to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/*.skill --clobber